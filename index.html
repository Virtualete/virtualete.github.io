<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Virtualete</title>
<style>
:root{--bg:#16161b;--card:#1f2029;--line:#2c2d38;--text:#ecebf2;--muted:#aeabbd;--accent:#e26bd8;--note:#ffd166;--cyan:#9fd3ff;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--display:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5}
a{color:var(--note)}a:hover{color:#ffe7a8}
code{font-family:ui-monospace,Menlo,monospace;font-size:.92em;color:var(--note)}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.gate p{font-size:20px;color:var(--muted);margin:0}
.loading{color:var(--muted);padding:48px 24px;text-align:center}
.top{position:sticky;top:0;z-index:5;background:rgba(22,22,27,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px clamp(16px,4vw,48px)}
.top .row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
.top .site{color:var(--muted);text-decoration:none;font-size:14px}
.top .item{font-weight:700;font-size:16px}
.site-frame{display:block;width:100%;border:0}
.pills{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
.pill{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text);text-decoration:none;background:var(--card);cursor:pointer;white-space:nowrap}
.pill:hover{border-color:var(--muted)}.pill.on{background:var(--accent);border-color:var(--accent);color:#1a0d19;font-weight:700}
main.page{padding:24px clamp(16px,4vw,48px) 80px;max-width:1700px;margin:0 auto}
h1{font-family:var(--display);font-size:clamp(28px,4vw,48px);line-height:1.05;margin:8px 0 16px}
h2{font-family:var(--display);font-size:clamp(22px,2.6vw,32px);margin:40px 0 14px}
h2[id]{scroll-margin-top:120px}
h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
p{margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:13px}.lead{font-size:18px;color:var(--muted);max-width:980px}
.hub{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.hub a{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-decoration:none;color:var(--text)}
.hub a:hover{border-color:var(--accent)}.hub b{font-size:20px;display:block;margin-bottom:6px}
.card{background:var(--card);border-radius:12px;padding:16px 18px}
.card .big{font-family:var(--display);font-size:30px;font-weight:800;color:var(--note);margin:0}
.card .num{color:var(--accent);font-weight:700;margin:0}
.grid2,.grid3,.grid4{display:grid;gap:14px}
.grid2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.grid3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.grid4{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.leg{display:flex;gap:14px;align-items:center}.leg-svg{width:84px;height:84px;flex:none;border-radius:8px;overflow:hidden}
.leg-svg svg{width:100%;height:100%}
.table-wrap{overflow-x:auto;margin:16px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;color:var(--accent);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:8px 10px}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.fig{position:relative;background:#10162b;border-radius:10px;overflow:hidden;cursor:zoom-in;display:flex;align-items:center;justify-content:center}
.fig svg,.fig img{display:block;width:100%;height:auto;max-height:560px}
.fig.wide svg,.fig.wide img{max-height:none}
.fig.scene{background:#0b0d14}
.fig:focus-visible{outline:2px solid var(--note);outline-offset:2px}
.zoom-hint{position:absolute;right:8px;top:6px;font-size:16px;color:#fff;opacity:.55;pointer-events:none}
.fig:hover .zoom-hint{opacity:1}
.mg-view{position:relative;height:calc(100vh - 200px);min-height:420px;margin:12px 0;background:#14161d;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mg-view.full{position:fixed;inset:0;height:auto;margin:0;z-index:40;border-radius:0;border:0}
.mg-stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}.mg-stage.drag{cursor:grabbing}
.mg-content{position:absolute;left:0;top:0}.mg-content svg{display:block;width:100%;height:100%}
.mg-tools{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:2}
.mg-tools button{min-height:34px;min-width:34px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:0 10px;font:inherit;font-size:14px;cursor:pointer}
.mg-tools button:hover{border-color:var(--muted)}
.mg-view [data-room]{cursor:pointer}
.mg-view [data-room].sel polygon,.mg-view [data-room].sel rect,.mg-view polygon[data-room].sel{stroke:#fff!important;stroke-width:4px!important}
.mg-card{position:absolute;right:10px;top:54px;max-height:calc(100% - 64px);width:min(380px,calc(100% - 20px));overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;z-index:3;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.4)}
.mg-card[hidden]{display:none}.mg-card h3{font-family:var(--display);font-size:20px;margin:0 30px 2px 0}
.mg-card h5{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:12px 0 4px}
.mg-card ul{margin:0;padding-left:18px}.mg-card li{margin:2px 0}.mg-card a{cursor:pointer}
.mg-card .x{position:absolute;right:8px;top:8px;min-height:30px;min-width:30px;border:1px solid var(--line);background:none;color:var(--text);border-radius:8px;cursor:pointer}
.mg-tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin:2px 4px 2px 0;font-size:12px;color:var(--muted)}
.mg-filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:16px 0 4px}
.mg-filters input[type=search]{min-height:38px;min-width:min(320px,100%);background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:0 12px;font:inherit}
.mg-muted{color:var(--muted)}.mg-h3{font-family:var(--display);margin:28px 0 8px;font-size:22px}
.mg-table-wrap{overflow-x:auto}.mg-table{font-size:14px}.mg-table th small{display:block;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none}
.mg-table code{font-size:12px;color:var(--muted)}
.mg-st-ok{color:#7bd88f}.mg-st-off{color:#ff8a8a;font-weight:700}.mg-st-unknown{color:var(--note)}
.zone-facts{background:var(--card);border-radius:12px;padding:16px 18px;margin-bottom:12px;color:var(--muted)}
.zone-facts b{color:var(--text)}
.prop-index{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.prop{border-top:1px solid var(--line);padding-top:28px;margin-top:36px;scroll-margin-top:110px}
.prop-head{display:flex;flex-wrap:wrap;gap:20px 48px;justify-content:space-between}
.ph-main{flex:1 1 520px;min-width:0}.ph-meta{flex:0 1 420px;display:flex;flex-direction:column;gap:6px}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.prop h2{margin:4px 0 8px;font-size:clamp(28px,3.6vw,48px);line-height:1.05}
.hook{font-size:19px;color:var(--note)}
.palette{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;gap:4px;font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.chip i{display:block;width:64px;height:30px;border-radius:6px;border:1px solid #ffffff22}
.bar{display:flex;height:12px;border-radius:4px;overflow:hidden}.bar span{display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}.lg{display:flex;align-items:center;gap:6px}.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px 48px;margin-top:22px}
.sec{margin:0 0 18px}
.sig{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.3}
.tri{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;align-items:baseline}
.tri b.base{color:#cfc9dc}.tri b.contrast{color:var(--cyan)}.tri b.exotic{color:var(--accent)}
.pat{margin-bottom:8px}.pat p{color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px 36px;background:var(--card);border-radius:12px;padding:20px 22px;margin:6px 0 20px}
.tr{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr);gap:14px;margin-bottom:6px}.tr b{color:var(--cyan)}
@media (max-width:640px){.tr{grid-template-columns:1fr;gap:2px}.tri{grid-template-columns:1fr;gap:0}}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.room{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.room figcaption{display:flex;flex-direction:column;gap:4px}.room figcaption b{font-size:17px}
/* Valoraciones */
.top .row{justify-content:space-between}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
button.pill{font:inherit;font-size:13px}
.pill.accent{background:var(--note);border-color:var(--note);color:#2a2000;font-weight:700}
.help{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:8px 0 4px;font-size:14px;max-width:1000px}
.help[hidden]{display:none}.help p{margin:0 0 6px}.help b{color:var(--note)}
.rates{display:flex;flex-direction:column;gap:6px;background:#1b1c24;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rate-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.rate-aspect{font-size:13px;color:var(--muted);flex:1 1 150px}
.stars{display:flex}
.star{width:34px;height:34px;border:0;background:none;color:#4a4858;font-size:22px;cursor:pointer;padding:0;line-height:1}
.star.on{color:var(--note)}.star:hover{color:#ffe7a8}
.star:focus-visible,.cmt-toggle:focus-visible{outline:2px solid var(--note);outline-offset:1px;border-radius:6px}
.cmt-toggle{border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;min-height:34px}
.cmt{width:100%;background:#12131a;border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;font-size:14px;padding:8px 10px;resize:vertical}
.cmt[hidden]{display:none}
.rate-prop .rates{max-width:780px}
.legend-strip{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:0 0 14px}
.legend-strip .lg i{width:10px;height:10px}
/* El visor */
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,8,12,.97);display:flex;flex-direction:column}
.lb[hidden]{display:none}
.lb-bar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.lb-label{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-tools{display:flex;gap:6px;flex:none}
.lb-tools button{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px;cursor:pointer}
.lb-tools button:hover{border-color:var(--muted)}
.lb-stage{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:grab}
.lb-stage.drag{cursor:grabbing}
.lb-content{position:absolute;left:0;top:0}
.lb-content svg,.lb-content img{display:block;width:100%;height:100%}
.lb-help{position:absolute;left:14px;bottom:10px;font-size:12px;color:#8f8ca0;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Diseño ampliado">
<div class="lb-bar"><span class="lb-label" id="lb-label"></span>
<span class="lb-tools"><button type="button" data-a="prev" aria-label="Anterior">‹</button><button type="button" data-a="next" aria-label="Siguiente">›</button><button type="button" data-a="out" aria-label="Alejar">−</button><button type="button" data-a="in" aria-label="Acercar">+</button><button type="button" data-a="fit" aria-label="Ajustar a la pantalla">⤢</button><button type="button" data-a="close" aria-label="Cerrar">✕</button></span></div>
<div class="lb-stage" id="lb-stage"><div class="lb-content" id="lb-content"></div><p class="lb-help">Rueda o pellizco: zoom · arrastrar: mover · doble clic: ajustar · ← →: anterior y siguiente · Esc: cerrar</p></div>
</div>
<script>
"use strict";
const CFG = {"salt":"3XKlpgJEeNmd0f9CTm7hxA==","iterations":250000,"manifest":"beb7b7b8f2e80760120e87ef.bin"};
const app = document.getElementById("app");
const deny = () => { document.title = "Virtualete"; app.innerHTML = '<main class="gate"><p>No tienes acceso a esta página</p></main>'; };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

(async () => {
  const secret = new URLSearchParams(location.search).get("sharingKey");
  if (!CFG || !secret || !window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") return deny();
  app.innerHTML = '<p class="loading">Abriendo…</p>';
  let key;
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveKey"]);
    key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(CFG.salt), iterations: CFG.iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  } catch (_) { return deny(); }

  const cache = new Map();
  async function open(file) {
    if (cache.has(file)) return cache.get(file);
    const job = (async () => {
      const res = await fetch("d/" + file, { cache: "no-cache" });
      if (!res.ok) throw new Error("missing");
      const buf = await res.arrayBuffer();
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(buf, 0, 12) }, key, new Uint8Array(buf, 12));
      const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
      return new Response(stream).arrayBuffer();
    })();
    cache.set(file, job);
    return job;
  }
  const text = async file => new TextDecoder().decode(await open(file));

  let manifest;
  try { manifest = JSON.parse(await text(CFG.manifest)); } catch (_) { return deny(); }
  document.title = manifest.site;
  const blobUrls = new Map();
  // ───── Valoraciones: estrellas y comentarios por propuesta y por sala, guardados en este navegador ─────
  const STORE = "virtualete.valoraciones.v1", HELP_SEEN = "virtualete.ayuda-valoraciones";
  let ratings = {};
  try { ratings = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (_) { ratings = {}; }
  let currentItem = null;
  function saveRatings() { try { localStorage.setItem(STORE, JSON.stringify(ratings)); } catch (_) {} if (currentItem) updateCount(currentItem); }
  const mine = it => Object.keys(ratings).filter(k => k.startsWith(it.id + ":") && ratings[k] && (ratings[k].s || (ratings[k].c || "").trim()));
  function updateCount(it) {
    currentItem = it;
    const b = document.getElementById("copy-btn");
    if (b && !b.dataset.flash) b.textContent = "Copiar valoraciones (" + mine(it).length + ")";
  }
  function orderKey(k) {
    const m = k.split(":")[1].match(/^(\d+)\.p(\d+)(?:\.s(\d+))?\.(tema|diseno)$/);
    return m ? [+m[1], +m[2], m[3] ? +m[3] : 0, m[4] === "tema" ? 0 : 1] : [999, 0, 0, 0];
  }
  function mountRatings(root, it) {
    for (const slot of root.querySelectorAll("[data-rate]")) {
      const id = it.id + ":" + slot.dataset.rate, group = slot.closest(".rates");
      const meta = { zone: group.dataset.zone, prop: group.dataset.prop, room: group.dataset.room, aspect: slot.dataset.aspect };
      slot.className = "rate";
      slot.innerHTML = '<div class="rate-row"><span class="rate-aspect">' + esc(meta.aspect) + '</span><span class="stars" role="group" aria-label="' + esc(meta.aspect) + '">' +
        [1, 2, 3, 4, 5].map(v => '<button type="button" class="star" data-v="' + v + '" aria-label="' + v + (v === 1 ? " estrella" : " estrellas") + '" aria-pressed="false">★</button>').join("") +
        '</span><button type="button" class="cmt-toggle">Comentar</button></div><textarea class="cmt" rows="2" placeholder="Tu comentario…" aria-label="Comentario: ' + esc(meta.aspect) + '" hidden></textarea>';
      const stars = [...slot.querySelectorAll(".star")], area = slot.querySelector(".cmt"), toggle = slot.querySelector(".cmt-toggle");
      const paint = () => { const v = (ratings[id] || {}).s || 0; stars.forEach(b => { b.classList.toggle("on", +b.dataset.v <= v); b.setAttribute("aria-pressed", String(+b.dataset.v === v)); }); };
      const put = patch => {
        const next = Object.assign({}, ratings[id], meta, patch, { t: Date.now() });
        if (!next.s && !(next.c || "").trim()) delete ratings[id]; else ratings[id] = next;
        saveRatings();
      };
      const label = () => area.hidden ? ((area.value || "").trim() ? "Ver comentario" : "Comentar") : "Ocultar comentario";
      stars.forEach(b => b.addEventListener("click", () => { const v = +b.dataset.v; put({ s: (ratings[id] || {}).s === v ? 0 : v }); paint(); }));
      const saved = (ratings[id] || {}).c || "";
      if (saved.trim()) { area.value = saved; area.hidden = false; }
      toggle.textContent = label();
      toggle.addEventListener("click", () => { area.hidden = !area.hidden; toggle.textContent = label(); if (!area.hidden) area.focus(); });
      let timer;
      area.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => put({ c: area.value }), 300); });
      area.addEventListener("blur", () => { clearTimeout(timer); put({ c: area.value }); toggle.textContent = label(); });
      paint();
    }
  }
  function exportText(it) {
    const keys = mine(it).sort((a, b) => { const x = orderKey(a), y = orderKey(b); for (let i = 0; i < 4; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; });
    if (!keys.length) return "";
    const out = ["Valoraciones · " + it.title, "Copiado el " + new Date().toLocaleString("es-ES"), ""];
    let zone = null, prop = null;
    for (const k of keys) {
      const r = ratings[k];
      if (r.zone !== zone) { zone = r.zone; prop = null; out.push("", "## " + zone); }
      if (r.prop !== prop) { prop = r.prop; out.push("### " + prop); }
      const stars = r.s ? "★".repeat(r.s) + "☆".repeat(5 - r.s) + " (" + r.s + "/5)" : "sin estrellas";
      const c = (r.c || "").trim();
      out.push("- " + (r.room ? "Sala " + r.room : "Propuesta") + " · " + r.aspect + ": " + stars + (c ? " — " + c.replace(/\s*\n\s*/g, " / ") : ""));
    }
    return out.join("\n");
  }
  function flash(btn, text) { btn.dataset.flash = "1"; btn.textContent = text; setTimeout(() => { delete btn.dataset.flash; updateCount(currentItem); }, 1800); }
  async function copyAll(it, btn) {
    const text = exportText(it);
    if (!text) return flash(btn, "Aún no has valorado nada");
    try { await navigator.clipboard.writeText(text); return flash(btn, "¡Copiado!"); } catch (_) {}
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove();
    flash(btn, ok ? "¡Copiado!" : "No se ha podido copiar");
  }


  function route() {
    const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
    return { item: parts[0] || "", page: parts[1] || "", anchor: parts[2] || "" };
  }
  function hub() {
    app.innerHTML = '<main class="page"><h1>' + esc(manifest.site) + '</h1><div class="hub">' +
      manifest.items.map(it => '<a href="#/' + esc(it.id) + '"><b>' + esc(it.title) + '</b><p class="muted small">' + esc(it.date) + '</p><p>' + esc(it.desc) + "</p></a>").join("") + "</div></main>";
  }
  async function itemPage(it, pageId, anchor) {
    document.body.style.overflow = "";
    const page = it.pages.find(p => p.id === pageId) || it.pages[0];
    const pills = it.pages.map(p => '<a class="pill' + (p.id === page.id ? " on" : "") + '" href="#/' + esc(it.id) + "/" + esc(p.id) + '">' + esc(p.label) + "</a>").join("");
    const tools = (it.legend ? '<a class="pill" href="' + esc(it.legend) + '">Leyenda</a>' : "") +
      (it.help ? '<button type="button" class="pill" id="help-btn" aria-expanded="false">¿Cómo valorar?</button><button type="button" class="pill accent" id="copy-btn"></button>' : "");
    const help = it.help ? '<div class="help" id="help" hidden>' + it.help.map(t => "<p>" + esc(t) + "</p>").join("") + "</div>" : "";
    app.innerHTML = '<header class="top"><div class="row"><span><a class="site" href="#/">' + esc(manifest.site) + '</a> · <span class="item">' + esc(it.title) + '</span></span><span class="tools">' + tools + '</span></div><nav class="pills">' + pills + '</nav></header><main class="page">' + help + '<div id="content"><p class="loading">Abriendo…</p></div></main>';
    const copyBtn = document.getElementById("copy-btn");
    if (copyBtn) copyBtn.addEventListener("click", () => copyAll(it, copyBtn));
    updateCount(it);
    const helpBtn = document.getElementById("help-btn"), helpBox = document.getElementById("help");
    if (helpBtn) {
      const setHelp = open => { helpBox.hidden = !open; helpBtn.setAttribute("aria-expanded", String(open)); helpBtn.classList.toggle("on", open); };
      helpBtn.addEventListener("click", () => { setHelp(helpBox.hidden); try { localStorage.setItem(HELP_SEEN, "1"); } catch (_) {} });
      let seen = false; try { seen = !!localStorage.getItem(HELP_SEEN); } catch (_) {}
      if (!seen) setHelp(true);
    }
    const on = app.querySelector(".pill.on"); if (on) on.scrollIntoView({ block: "nearest", inline: "center" });
    const content = document.getElementById("content");
    try { content.innerHTML = await text(manifest.files[page.chunk]); } catch (_) { content.innerHTML = '<p class="loading">No se ha podido abrir esta página.</p>'; return; }
    for (const img of content.querySelectorAll("img[data-blob]")) {
      const b = it.blobs && it.blobs[img.dataset.blob]; if (!b) continue;
      if (!blobUrls.has(b.chunk)) blobUrls.set(b.chunk, URL.createObjectURL(new Blob([await open(manifest.files[b.chunk])], { type: b.type })));
      img.src = blobUrls.get(b.chunk);
    }
    mountRatings(content, it);
    await mountMaps(content, it);
    mountFilters(content);
    for (const a of content.querySelectorAll("[data-scroll]")) a.addEventListener("click", () => { history.replaceState(null, "", "#/" + it.id + "/" + page.id + "/" + a.dataset.scroll); scrollToAnchor(a.dataset.scroll); });
    if (anchor) scrollToAnchor(anchor); else window.scrollTo(0, 0);
  }
  // ───── El mapa del mundo (exportado de Megraphvania): zoom, arrastre y la ficha de cada sala al pulsarla ─────
  const jsonCache = new Map();
  async function blobJson(it, name) {
    const b = it.blobs && it.blobs[name]; if (!b) return {};
    if (!jsonCache.has(b.chunk)) jsonCache.set(b.chunk, text(manifest.files[b.chunk]).then(JSON.parse).catch(() => ({})));
    return jsonCache.get(b.chunk);
  }
  async function mountMaps(root, it) {
    for (const view of root.querySelectorAll(".mg-view")) mapViewer(view, await blobJson(it, view.dataset.rooms));
  }
  function mapViewer(view, rooms) {
    const stage = view.querySelector(".mg-stage"), box = view.querySelector(".mg-content"), svg = box.querySelector("svg");
    if (!svg) return;
    const vb = svg.viewBox && svg.viewBox.baseVal, w = vb && vb.width ? vb.width : 1000, h = vb && vb.height ? vb.height : 700;
    view.insertAdjacentHTML("beforeend", '<div class="mg-tools"><button type="button" data-z="out" aria-label="Alejar">−</button><button type="button" data-z="in" aria-label="Acercar">+</button><button type="button" data-z="fit">Ajustar</button><button type="button" data-z="full" aria-pressed="false">⤢ Pantalla completa</button></div><aside class="mg-card" hidden aria-live="polite"></aside>');
    const card = view.querySelector(".mg-card"), fullBtn = view.querySelector('[data-z="full"]');
    let s = 1, tx = 0, ty = 0, moved = 0; const pts = new Map(); let pinch = null;
    const apply = () => { box.style.width = w * s + "px"; box.style.height = h * s + "px"; box.style.left = tx + "px"; box.style.top = ty + "px"; };
    const fit = () => { const r = stage.getBoundingClientRect(); if (!r.width) return; s = Math.min(r.width / w, r.height / h) * 0.97; tx = (r.width - w * s) / 2; ty = (r.height - h * s) / 2; apply(); };
    const zoom = (f, cx, cy) => { const r = stage.getBoundingClientRect(); if (cx === undefined) { cx = r.width / 2; cy = r.height / 2; } const ns = Math.max(0.05, Math.min(s * f, 40)); tx = cx - (cx - tx) * ns / s; ty = cy - (cy - ty) * ns / s; s = ns; apply(); };
    const center = el => { const r = stage.getBoundingClientRect(), b = el.getBoundingClientRect(); tx += r.left + r.width / 2 - (b.left + b.width / 2); ty += r.top + r.height / 2 - (b.top + b.height / 2); apply(); };
    const select = id => { svg.querySelectorAll(".sel").forEach(x => x.classList.remove("sel")); if (!id) return null; const el = svg.querySelector('[data-room="' + CSS.escape(id) + '"]'); if (el) el.classList.add("sel"); return el; };
    const closeCard = () => { card.hidden = true; select(""); };
    function showRoom(id, recenter) {
      const r = rooms[id]; if (!r) return;
      const el = select(id);
      const links = (r.links || []).map(l => '<li><a data-go="' + esc(l.to) + '">' + esc(l.name) + "</a>" + (l.area && l.area !== r.area ? ' <span class="mg-muted">(' + esc(l.area) + ")</span>" : "") + (l.req ? " — " + esc(l.req) : "") + (l.flags && l.flags.length ? ' <span class="mg-muted">' + esc(l.flags.join(", ")) + "</span>" : "") + "</li>").join("");
      card.innerHTML = '<button type="button" class="x" aria-label="Cerrar">✕</button><h3>' + esc(r.name) + '</h3><p class="mg-muted small">' + esc(r.area) + " · <code>" + esc(id) + "</code>" + (r.difficulty !== undefined && r.difficulty !== null ? " · dificultad " + esc(r.difficulty) : "") + "</p>" +
        (r.tags && r.tags.length ? "<div>" + r.tags.map(t => '<span class="mg-tag">' + esc(t) + "</span>").join("") + "</div>" : "") +
        (r.notes ? "<h5>Notas</h5><p>" + esc(r.notes) + "</p>" : "") +
        (r.contents && r.contents.length ? "<h5>Contenido</h5><ul>" + r.contents.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" : "") +
        (links ? "<h5>Conexiones</h5><ul>" + links + "</ul>" : "");
      card.hidden = false; card.scrollTop = 0;
      card.querySelector(".x").onclick = closeCard;
      card.querySelectorAll("[data-go]").forEach(a => a.onclick = () => showRoom(a.dataset.go, true));
      if (el) { const sr = el.getBoundingClientRect(), vr = stage.getBoundingClientRect(); if (recenter || sr.right < vr.left || sr.left > vr.right || sr.bottom < vr.top || sr.top > vr.bottom) center(el); }
    }
    const setFull = on => { view.classList.toggle("full", on); fullBtn.setAttribute("aria-pressed", String(on)); fullBtn.textContent = on ? "✕ Salir" : "⤢ Pantalla completa"; document.body.style.overflow = on ? "hidden" : ""; requestAnimationFrame(fit); };
    view.querySelector(".mg-tools").addEventListener("click", ev => { const b = ev.target.closest("button"); if (!b) return; ({ in: () => zoom(1.4), out: () => zoom(1 / 1.4), fit, full: () => setFull(!view.classList.contains("full")) })[b.dataset.z](); });
    stage.addEventListener("wheel", ev => { ev.preventDefault(); const r = stage.getBoundingClientRect(); zoom(Math.exp(-ev.deltaY * 0.0015), ev.clientX - r.left, ev.clientY - r.top); }, { passive: false });
    stage.addEventListener("pointerdown", ev => { stage.setPointerCapture(ev.pointerId); pts.set(ev.pointerId, [ev.clientX, ev.clientY]); moved = 0; stage.classList.add("drag"); if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
    stage.addEventListener("pointermove", ev => {
      if (!pts.has(ev.pointerId)) return; const [px, py] = pts.get(ev.pointerId); pts.set(ev.pointerId, [ev.clientX, ev.clientY]); moved += Math.abs(ev.clientX - px) + Math.abs(ev.clientY - py);
      if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); const r = stage.getBoundingClientRect(); zoom(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); pinch = d; }
      else if (pts.size === 1) { tx += ev.clientX - px; ty += ev.clientY - py; apply(); }
    });
    const up = ev => { pts.delete(ev.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) stage.classList.remove("drag"); };
    stage.addEventListener("pointerup", ev => { const click = moved < 6 && pts.size === 1; up(ev); if (!click) return; const room = document.elementsFromPoint(ev.clientX, ev.clientY).map(x => x.closest && x.closest("[data-room]")).find(x => x && view.contains(x)); if (room) showRoom(room.getAttribute("data-room")); });
    stage.addEventListener("pointercancel", up);
    stage.addEventListener("dblclick", fit);
    document.addEventListener("keydown", ev => { if (ev.key !== "Escape" || !view.isConnected || !lb.hidden) return; if (!card.hidden) closeCard(); else if (view.classList.contains("full")) setFull(false); });
    window.addEventListener("resize", () => { if (view.isConnected) fit(); });
    fit();
  }
  function mountFilters(root) {
    const q = root.querySelector("[data-mg-filter]"), off = root.querySelector("[data-mg-off]"), count = root.querySelector("[data-mg-count]");
    if (!q) return;
    const rows = [...root.querySelectorAll(".mg-table tbody tr")];
    const run = () => {
      const t = q.value.trim().toLowerCase(); let shown = 0;
      for (const tr of rows) { tr.hidden = (t && !tr.textContent.toLowerCase().includes(t)) || (off && off.checked && tr.dataset.status !== "off"); if (!tr.hidden) shown++; }
      for (const wrap of root.querySelectorAll(".mg-table-wrap")) { const any = [...wrap.querySelectorAll("tbody tr")].some(tr => !tr.hidden); wrap.hidden = !any; const h = wrap.previousElementSibling; if (h && h.classList.contains("mg-h3")) h.hidden = !any; }
      if (count) count.textContent = shown === rows.length ? rows.length + " objetos" : !shown && off && off.checked && !t ? "ninguno: los " + rows.length + " cumplen lo que se pidió" : shown + " de " + rows.length + " objetos";
    };
    q.addEventListener("input", run); if (off) off.addEventListener("change", run); run();
  }
  function scrollToAnchor(id) { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
  // ───── Un sitio entero (el atlas): su página se abre en un marco; sus imágenes y su voz salen de los trozos cifrados ─────
  let siteUrl = null;
  function siteShim() {
    const f = window.fetch;
    window.fetch = function (u, o) {
      const p = typeof u === "string" ? u : (u && u.url) || "";
      if (p.indexOf("voz/") === 0 && window.parent && window.parent.__siteFile) {
        return window.parent.__siteFile(p).then(b => new Response(b, { headers: { "Content-Type": /\.json$/.test(p) ? "application/json" : "video/mp4" } }));
      }
      return f.apply(this, arguments);
    };
  }
  async function siteItem(it) {
    app.dataset.view = it.id;
    document.body.style.overflow = "";
    app.innerHTML = '<header class="top"><div class="row"><span><a class="site" href="#/">' + esc(manifest.site) + '</a> · <span class="item">' + esc(it.title) + '</span></span></div></header><iframe class="site-frame" title="' + esc(it.title) + '"></iframe>';
    const frame = app.querySelector(".site-frame"), bar = app.querySelector(".top");
    const fit = () => { frame.style.height = Math.max(200, innerHeight - bar.offsetHeight) + "px"; };
    fit();
    window.addEventListener("resize", fit);
    window.__siteFile = p => (it.site.files[p] ? open(manifest.files[it.site.files[p]]) : Promise.reject(new Error("sin archivo: " + p)));
    if (!siteUrl) {
      const ref = /(["'(\s=])img\/([^"'\s)<>?]+)(\?[^"'\s)<>]*)?/g;
      let html = await text(manifest.files[it.site.entry]);
      const urls = new Map();
      await Promise.all([...new Set([...html.matchAll(ref)].map(m => m[2]))].map(async p => {
        const id = it.site.files["img/" + p];
        if (id) urls.set(p, URL.createObjectURL(new Blob([await open(manifest.files[id])], { type: "image/jpeg" })));
      }));
      html = html.replace(ref, (m, pre, p) => (urls.has(p) ? pre + urls.get(p) : m));
      const at = html.indexOf("<head>");
      if (at < 0) throw new Error("la página del sitio no tiene <head>");
      html = html.slice(0, at + 6) + "<script>(" + siteShim.toString() + ")();<\/script>" + html.slice(at + 6);
      siteUrl = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    }
    frame.src = siteUrl;
  }
  async function render() {
    const r = route();
    const it = manifest.items.find(i => i.id === r.item);
    if (!it) return hub();
    if (it.site) return siteItem(it);
    const current = app.dataset.view;
    const view = it.id + "/" + (r.page || it.pages[0].id);
    if (current === view && r.anchor) return scrollToAnchor(r.anchor);
    app.dataset.view = view;
    await itemPage(it, r.page, r.anchor);
  }
  window.addEventListener("hashchange", render);
  render();

  // ───── El visor: amplía cualquier diseño (plano, esbozo, mapa) con zoom y desplazamiento ─────
  const lb = document.getElementById("lb"), stage = document.getElementById("lb-stage"), box = document.getElementById("lb-content"), label = document.getElementById("lb-label");
  let list = [], at = 0, w = 1, h = 1, s = 1, tx = 0, ty = 0;
  const pointers = new Map(); let pinch = null;
  function natural(el) {
    if (el.tagName.toLowerCase() === "img") return [el.naturalWidth || 1000, el.naturalHeight || 700];
    const vb = el.viewBox && el.viewBox.baseVal;
    return vb && vb.width ? [vb.width, vb.height] : [el.clientWidth || 1000, el.clientHeight || 700];
  }
  function apply() { box.style.width = (w * s) + "px"; box.style.height = (h * s) + "px"; box.style.left = tx + "px"; box.style.top = ty + "px"; }
  function fit() { const r = stage.getBoundingClientRect(); s = Math.min(r.width / w, r.height / h) * 0.96; tx = (r.width - w * s) / 2; ty = (r.height - h * s) / 2; apply(); }
  function zoom(f, cx, cy) {
    const r = stage.getBoundingClientRect(); if (cx === undefined) { cx = r.width / 2; cy = r.height / 2; }
    const ns = Math.max(0.05, Math.min(s * f, 60)); tx = cx - (cx - tx) * (ns / s); ty = cy - (cy - ty) * (ns / s); s = ns; apply();
  }
  function show(i) {
    at = (i + list.length) % list.length;
    const src = list[at].querySelector("svg, img");
    if (!src) return;
    const copy = src.cloneNode(true); copy.removeAttribute("style");
    box.replaceChildren(copy); [w, h] = natural(src); label.textContent = list[at].dataset.label || "";
    fit();
  }
  function openAt(el) {
    const scope = el.closest("article") || document.getElementById("content") || document.body;
    list = Array.from(scope.querySelectorAll("[data-max]")); if (!list.length) return;
    lb.hidden = false; document.body.style.overflow = "hidden"; show(list.indexOf(el));
  }
  function close() { lb.hidden = true; box.replaceChildren(); document.body.style.overflow = ""; if (list[at]) list[at].focus(); }
  app.addEventListener("click", ev => { const el = ev.target.closest("[data-max]"); if (el) openAt(el); });
  app.addEventListener("keydown", ev => { const el = ev.target.closest && ev.target.closest("[data-max]"); if (el && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openAt(el); } });
  lb.addEventListener("click", ev => {
    const b = ev.target.closest("button[data-a]"); if (!b) return;
    ({ prev: () => show(at - 1), next: () => show(at + 1), in: () => zoom(1.4), out: () => zoom(1 / 1.4), fit, close })[b.dataset.a]();
  });
  document.addEventListener("keydown", ev => {
    if (lb.hidden) return;
    if (ev.key === "Escape") close(); else if (ev.key === "ArrowLeft") show(at - 1); else if (ev.key === "ArrowRight") show(at + 1);
    else if (ev.key === "+" || ev.key === "=") zoom(1.4); else if (ev.key === "-") zoom(1 / 1.4); else if (ev.key === "0") fit();
  });
  stage.addEventListener("wheel", ev => { ev.preventDefault(); const r = stage.getBoundingClientRect(); zoom(Math.exp(-ev.deltaY * 0.0015), ev.clientX - r.left, ev.clientY - r.top); }, { passive: false });
  stage.addEventListener("dblclick", ev => { const r = stage.getBoundingClientRect(); const fitS = Math.min(r.width / w, r.height / h) * 0.96; if (s > fitS * 1.05) fit(); else zoom(2.5, ev.clientX - r.left, ev.clientY - r.top); });
  stage.addEventListener("pointerdown", ev => { stage.setPointerCapture(ev.pointerId); pointers.set(ev.pointerId, [ev.clientX, ev.clientY]); stage.classList.add("drag"); if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
  stage.addEventListener("pointermove", ev => {
    if (!pointers.has(ev.pointerId)) return;
    const [px, py] = pointers.get(ev.pointerId); pointers.set(ev.pointerId, [ev.clientX, ev.clientY]);
    if (pointers.size === 2 && pinch) {
      const [a, b] = [...pointers.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); const r = stage.getBoundingClientRect();
      zoom(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); pinch = d;
    } else if (pointers.size === 1) { tx += ev.clientX - px; ty += ev.clientY - py; apply(); }
  });
  const up = ev => { pointers.delete(ev.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) stage.classList.remove("drag"); };
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
  window.addEventListener("resize", () => { if (!lb.hidden) fit(); });
})();
