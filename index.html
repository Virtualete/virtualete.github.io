<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Virtualete</title>
<style>
:root{--bg:#16161b;--card:#1f2029;--line:#2c2d38;--text:#ecebf2;--muted:#aeabbd;--accent:#e26bd8;--note:#ffd166;--cyan:#9fd3ff;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--display:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5}
a{color:var(--note)}a:hover{color:#ffe7a8}
code{font-family:ui-monospace,Menlo,monospace;font-size:.92em;color:var(--note)}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.gate p{font-size:20px;color:var(--muted);margin:0}
.loading{color:var(--muted);padding:48px 24px;text-align:center}
.top{position:sticky;top:0;z-index:5;background:rgba(22,22,27,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px clamp(16px,4vw,48px)}
.top .row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
.top .site{color:var(--muted);text-decoration:none;font-size:14px}
.top .item{font-weight:700;font-size:16px}
.pills{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
.pill{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text);text-decoration:none;background:var(--card);cursor:pointer;white-space:nowrap}
.pill:hover{border-color:var(--muted)}.pill.on{background:var(--accent);border-color:var(--accent);color:#1a0d19;font-weight:700}
main.page{padding:24px clamp(16px,4vw,48px) 80px;max-width:1700px;margin:0 auto}
h1{font-family:var(--display);font-size:clamp(28px,4vw,48px);line-height:1.05;margin:8px 0 16px}
h2{font-family:var(--display);font-size:clamp(22px,2.6vw,32px);margin:40px 0 14px}
h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
p{margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:13px}.lead{font-size:18px;color:var(--muted);max-width:980px}
.hub{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.hub a{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-decoration:none;color:var(--text)}
.hub a:hover{border-color:var(--accent)}.hub b{font-size:20px;display:block;margin-bottom:6px}
.card{background:var(--card);border-radius:12px;padding:16px 18px}
.card .big{font-family:var(--display);font-size:30px;font-weight:800;color:var(--note);margin:0}
.card .num{color:var(--accent);font-weight:700;margin:0}
.grid2,.grid3,.grid4{display:grid;gap:14px}
.grid2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.grid3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.grid4{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.leg{display:flex;gap:14px;align-items:center}.leg-svg{width:84px;height:84px;flex:none;border-radius:8px;overflow:hidden}
.leg-svg svg{width:100%;height:100%}
.table-wrap{overflow-x:auto;margin:16px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;color:var(--accent);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:8px 10px}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.fig{position:relative;background:#10162b;border-radius:10px;overflow:hidden;cursor:zoom-in;display:flex;align-items:center;justify-content:center}
.fig svg,.fig img{display:block;width:100%;height:auto;max-height:560px}
.fig.wide svg,.fig.wide img{max-height:none}
.fig.scene{background:#0b0d14}
.fig:focus-visible{outline:2px solid var(--note);outline-offset:2px}
.zoom-hint{position:absolute;right:8px;top:6px;font-size:16px;color:#fff;opacity:.55;pointer-events:none}
.fig:hover .zoom-hint{opacity:1}
.zone-facts{background:var(--card);border-radius:12px;padding:16px 18px;margin-bottom:12px;color:var(--muted)}
.zone-facts b{color:var(--text)}
.prop-index{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.prop{border-top:1px solid var(--line);padding-top:28px;margin-top:36px;scroll-margin-top:110px}
.prop-head{display:flex;flex-wrap:wrap;gap:20px 48px;justify-content:space-between}
.ph-main{flex:1 1 520px;min-width:0}.ph-meta{flex:0 1 420px;display:flex;flex-direction:column;gap:6px}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.prop h2{margin:4px 0 8px;font-size:clamp(28px,3.6vw,48px);line-height:1.05}
.hook{font-size:19px;color:var(--note)}
.palette{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;gap:4px;font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.chip i{display:block;width:64px;height:30px;border-radius:6px;border:1px solid #ffffff22}
.bar{display:flex;height:12px;border-radius:4px;overflow:hidden}.bar span{display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}.lg{display:flex;align-items:center;gap:6px}.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px 48px;margin-top:22px}
.sec{margin:0 0 18px}
.sig{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.3}
.tri{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;align-items:baseline}
.tri b.base{color:#cfc9dc}.tri b.contrast{color:var(--cyan)}.tri b.exotic{color:var(--accent)}
.pat{margin-bottom:8px}.pat p{color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px 36px;background:var(--card);border-radius:12px;padding:20px 22px;margin:6px 0 20px}
.tr{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr);gap:14px;margin-bottom:6px}.tr b{color:var(--cyan)}
@media (max-width:640px){.tr{grid-template-columns:1fr;gap:2px}.tri{grid-template-columns:1fr;gap:0}}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.room{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.room figcaption{display:flex;flex-direction:column;gap:4px}.room figcaption b{font-size:17px}
/* El visor */
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,8,12,.97);display:flex;flex-direction:column}
.lb[hidden]{display:none}
.lb-bar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.lb-label{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-tools{display:flex;gap:6px;flex:none}
.lb-tools button{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px;cursor:pointer}
.lb-tools button:hover{border-color:var(--muted)}
.lb-stage{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:grab}
.lb-stage.drag{cursor:grabbing}
.lb-content{position:absolute;left:0;top:0}
.lb-content svg,.lb-content img{display:block;width:100%;height:100%}
.lb-help{position:absolute;left:14px;bottom:10px;font-size:12px;color:#8f8ca0;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Diseño ampliado">
<div class="lb-bar"><span class="lb-label" id="lb-label"></span>
<span class="lb-tools"><button type="button" data-a="prev" aria-label="Anterior">‹</button><button type="button" data-a="next" aria-label="Siguiente">›</button><button type="button" data-a="out" aria-label="Alejar">−</button><button type="button" data-a="in" aria-label="Acercar">+</button><button type="button" data-a="fit" aria-label="Ajustar a la pantalla">⤢</button><button type="button" data-a="close" aria-label="Cerrar">✕</button></span></div>
<div class="lb-stage" id="lb-stage"><div class="lb-content" id="lb-content"></div><p class="lb-help">Rueda o pellizco: zoom · arrastrar: mover · doble clic: ajustar · ← →: anterior y siguiente · Esc: cerrar</p></div>
</div>
<script>
"use strict";
const CFG = {"salt":"3XKlpgJEeNmd0f9CTm7hxA==","iterations":250000,"manifest":"beb7b7b8f2e80760120e87ef.bin"};
const app = document.getElementById("app");
const deny = () => { document.title = "Virtualete"; app.innerHTML = '<main class="gate"><p>No tienes acceso a esta página</p></main>'; };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

(async () => {
  const secret = new URLSearchParams(location.search).get("sharingKey");
  if (!CFG || !secret || !window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") return deny();
  app.innerHTML = '<p class="loading">Abriendo…</p>';
  let key;
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveKey"]);
    key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(CFG.salt), iterations: CFG.iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  } catch (_) { return deny(); }

  const cache = new Map();
  async function open(file) {
    if (cache.has(file)) return cache.get(file);
    const job = (async () => {
      const res = await fetch("d/" + file, { cache: "no-cache" });
      if (!res.ok) throw new Error("missing");
      const buf = await res.arrayBuffer();
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(buf, 0, 12) }, key, new Uint8Array(buf, 12));
      const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
      return new Response(stream).arrayBuffer();
    })();
    cache.set(file, job);
    return job;
  }
  const text = async file => new TextDecoder().decode(await open(file));

  let manifest;
  try { manifest = JSON.parse(await text(CFG.manifest)); } catch (_) { return deny(); }
  document.title = manifest.site;
  const blobUrls = new Map();

  function route() {
    const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
    return { item: parts[0] || "", page: parts[1] || "", anchor: parts[2] || "" };
  }
  function hub() {
    app.innerHTML = '<main class="page"><h1>' + esc(manifest.site) + '</h1><div class="hub">' +
      manifest.items.map(it => '<a href="#/' + esc(it.id) + '"><b>' + esc(it.title) + '</b><p class="muted small">' + esc(it.date) + '</p><p>' + esc(it.desc) + "</p></a>").join("") + "</div></main>";
  }
  async function itemPage(it, pageId, anchor) {
    const page = it.pages.find(p => p.id === pageId) || it.pages[0];
    const pills = it.pages.map(p => '<a class="pill' + (p.id === page.id ? " on" : "") + '" href="#/' + esc(it.id) + "/" + esc(p.id) + '">' + esc(p.label) + "</a>").join("");
    app.innerHTML = '<header class="top"><div class="row"><a class="site" href="#/">' + esc(manifest.site) + '</a><span class="item">' + esc(it.title) + '</span></div><nav class="pills">' + pills + '</nav></header><main class="page" id="content"><p class="loading">Abriendo…</p></main>';
    const on = app.querySelector(".pill.on"); if (on) on.scrollIntoView({ block: "nearest", inline: "center" });
    const content = document.getElementById("content");
    try { content.innerHTML = await text(manifest.files[page.chunk]); } catch (_) { content.innerHTML = '<p class="loading">No se ha podido abrir esta página.</p>'; return; }
    for (const img of content.querySelectorAll("img[data-blob]")) {
      const b = it.blobs && it.blobs[img.dataset.blob]; if (!b) continue;
      if (!blobUrls.has(b.chunk)) blobUrls.set(b.chunk, URL.createObjectURL(new Blob([await open(manifest.files[b.chunk])], { type: b.type })));
      img.src = blobUrls.get(b.chunk);
    }
    for (const a of content.querySelectorAll("[data-scroll]")) a.addEventListener("click", () => { history.replaceState(null, "", "#/" + it.id + "/" + page.id + "/" + a.dataset.scroll); scrollToAnchor(a.dataset.scroll); });
    if (anchor) scrollToAnchor(anchor); else window.scrollTo(0, 0);
  }
  function scrollToAnchor(id) { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
  async function render() {
    const r = route();
    const it = manifest.items.find(i => i.id === r.item);
    if (!it) return hub();
    const current = app.dataset.view;
    const view = it.id + "/" + (r.page || it.pages[0].id);
    if (current === view && r.anchor) return scrollToAnchor(r.anchor);
    app.dataset.view = view;
    await itemPage(it, r.page, r.anchor);
  }
  window.addEventListener("hashchange", render);
  render();

  // ───── El visor: amplía cualquier diseño (plano, esbozo, mapa) con zoom y desplazamiento ─────
  const lb = document.getElementById("lb"), stage = document.getElementById("lb-stage"), box = document.getElementById("lb-content"), label = document.getElementById("lb-label");
  let list = [], at = 0, w = 1, h = 1, s = 1, tx = 0, ty = 0;
  const pointers = new Map(); let pinch = null;
  function natural(el) {
    if (el.tagName.toLowerCase() === "img") return [el.naturalWidth || 1000, el.naturalHeight || 700];
    const vb = el.viewBox && el.viewBox.baseVal;
    return vb && vb.width ? [vb.width, vb.height] : [el.clientWidth || 1000, el.clientHeight || 700];
  }
  function apply() { box.style.width = (w * s) + "px"; box.style.height = (h * s) + "px"; box.style.left = tx + "px"; box.style.top = ty + "px"; }
  function fit() { const r = stage.getBoundingClientRect(); s = Math.min(r.width / w, r.height / h) * 0.96; tx = (r.width - w * s) / 2; ty = (r.height - h * s) / 2; apply(); }
  function zoom(f, cx, cy) {
    const r = stage.getBoundingClientRect(); if (cx === undefined) { cx = r.width / 2; cy = r.height / 2; }
    const ns = Math.max(0.05, Math.min(s * f, 60)); tx = cx - (cx - tx) * (ns / s); ty = cy - (cy - ty) * (ns / s); s = ns; apply();
  }
  function show(i) {
    at = (i + list.length) % list.length;
    const src = list[at].querySelector("svg, img");
    if (!src) return;
    const copy = src.cloneNode(true); copy.removeAttribute("style");
    box.replaceChildren(copy); [w, h] = natural(src); label.textContent = list[at].dataset.label || "";
    fit();
  }
  function openAt(el) {
    const scope = el.closest("article") || document.getElementById("content") || document.body;
    list = Array.from(scope.querySelectorAll("[data-max]")); if (!list.length) return;
    lb.hidden = false; document.body.style.overflow = "hidden"; show(list.indexOf(el));
  }
  function close() { lb.hidden = true; box.replaceChildren(); document.body.style.overflow = ""; if (list[at]) list[at].focus(); }
  app.addEventListener("click", ev => { const el = ev.target.closest("[data-max]"); if (el) openAt(el); });
  app.addEventListener("keydown", ev => { const el = ev.target.closest && ev.target.closest("[data-max]"); if (el && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openAt(el); } });
  lb.addEventListener("click", ev => {
    const b = ev.target.closest("button[data-a]"); if (!b) return;
    ({ prev: () => show(at - 1), next: () => show(at + 1), in: () => zoom(1.4), out: () => zoom(1 / 1.4), fit, close })[b.dataset.a]();
  });
  document.addEventListener("keydown", ev => {
    if (lb.hidden) return;
    if (ev.key === "Escape") close(); else if (ev.key === "ArrowLeft") show(at - 1); else if (ev.key === "ArrowRight") show(at + 1);
    else if (ev.key === "+" || ev.key === "=") zoom(1.4); else if (ev.key === "-") zoom(1 / 1.4); else if (ev.key === "0") fit();
  });
  stage.addEventListener("wheel", ev => { ev.preventDefault(); const r = stage.getBoundingClientRect(); zoom(Math.exp(-ev.deltaY * 0.0015), ev.clientX - r.left, ev.clientY - r.top); }, { passive: false });
  stage.addEventListener("dblclick", ev => { const r = stage.getBoundingClientRect(); const fitS = Math.min(r.width / w, r.height / h) * 0.96; if (s > fitS * 1.05) fit(); else zoom(2.5, ev.clientX - r.left, ev.clientY - r.top); });
  stage.addEventListener("pointerdown", ev => { stage.setPointerCapture(ev.pointerId); pointers.set(ev.pointerId, [ev.clientX, ev.clientY]); stage.classList.add("drag"); if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
  stage.addEventListener("pointermove", ev => {
    if (!pointers.has(ev.pointerId)) return;
    const [px, py] = pointers.get(ev.pointerId); pointers.set(ev.pointerId, [ev.clientX, ev.clientY]);
    if (pointers.size === 2 && pinch) {
      const [a, b] = [...pointers.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); const r = stage.getBoundingClientRect();
      zoom(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); pinch = d;
    } else if (pointers.size === 1) { tx += ev.clientX - px; ty += ev.clientY - py; apply(); }
  });
  const up = ev => { pointers.delete(ev.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) stage.classList.remove("drag"); };
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
  window.addEventListener("resize", () => { if (!lb.hidden) fit(); });
})();
</script>
</body>
</html>
